; `pio run -t upload` with no -e would otherwise build AND flash every env in
; turn. Pin the default so a bare upload means the real firmware; pass
; -e seeed_xiao_esp32c3_nonet explicitly for the radio-free bring-up build.
[platformio]
default_envs = esp32dev

; XIAO ESP32C3 + MH-ET LIVE MAX30102 pulse oximeter node
[env:seeed_xiao_esp32c3]
build_src_filter = +<*> -<wifi_probe.cpp>
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; XIAO ESP32C3 has native USB — route Serial over USB CDC.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; Bring-up variant: identical sensor path, no WiFi/MQTT. Use this first when a
; board reboots or the serial port drops as soon as the radio starts.
[env:seeed_xiao_esp32c3_nonet]
extends         = env:seeed_xiao_esp32c3
build_src_filter = +<*> -<net.cpp> -<wifi_probe.cpp>
build_flags     =
    ${env:seeed_xiao_esp32c3.build_flags}
    -DNO_NETWORK
lib_deps        =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11


; Radio-only power probe. No sensor, no MQTT, no credentials needed.
[env:wifi_probe]
extends          = env:seeed_xiao_esp32c3
build_src_filter = -<*> +<wifi_probe.cpp>
lib_deps         =

; ---------------------------------------------------------------- ESP32 DevKit V1
; Classic Xtensa ESP32 with a CH343 USB-UART bridge and an AMS1117 regulator.
; Same firmware, different pins: I2C moves to GPIO21/22 and there is no native
; USB, so the CDC-on-boot flags do not apply.
[env:esp32dev]
platform         = espressif32
board            = esp32doit-devkit-v1
framework        = arduino
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
upload_speed     = 921600
build_src_filter = +<*> -<wifi_probe.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DI2C_SDA_PIN=21
    -DI2C_SCL_PIN=22
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

[env:esp32dev_probe]
extends          = env:esp32dev
build_src_filter = -<*> +<wifi_probe.cpp>
lib_deps         =
