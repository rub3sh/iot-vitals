# Local-network MQTT broker for the iot-vitals project.

listener 1883 0.0.0.0

# Anonymous access is fine on a trusted LAN. To lock it down:
#   1. docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/passwd vitals
#   2. set  allow_anonymous false  and  password_file /mosquitto/data/passwd
#   3. fill MQTT_USER / MQTT_PASS in firmware/include/secrets.h and server/.env
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice
