services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-vitals-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./broker/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
